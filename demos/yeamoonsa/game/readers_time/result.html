<script>
    // 결과 판정 (correct_count: 4개 이상 excellent / 2개 이상 good-job / 그 외 cheer-up)
    const _params = new URLSearchParams(location.search);
    const _correct = Number(_params.get('correct_count') ?? 5);
    const _result = _correct >= 4 ? 'excellent' : (_correct >= 2 ? 'good-job' : 'cheer-up');
    document.querySelectorAll('.overall-result > section').forEach(function (sec) {
        if (!sec.classList.contains(_result)) sec.remove();
    });

    function loadLottie(id, path, loop) {
        return lottie.loadAnimation({
            container: document.getElementById(id),
            renderer: 'svg',
            loop: loop,
            autoplay: true,
            path: path
        });
    }

    const excellent = loadLottie('excellent', `../../js/game/readers_time/step${_step}/excellent.json`, false);
    const good_job = loadLottie('good_job', `../../js/game/readers_time/step${_step}/good_job.json`, false);
    const cheer_up = loadLottie('cheer_up', `../../js/game/readers_time/step${_step}/cheer_up.json`, false);


    let result = _result;
    let book_no = _params.get('book_no') || 1;

    window.addEventListener("DOMContentLoaded", function() {
        let g_audio = new Audio();
        if(result == 'excellent'){
            g_audio.src = `../../audio/game/readerstime/g_sound_11.mp3`;
        }
        else if(result == 'good-job'){
            g_audio.src = `../../audio/game/readerstime/g_sound_13.mp3`;
        }
        else if(result == 'cheer-up'){
            g_audio.src = `../../audio/game/readerstime/g_sound_15.mp3`;
        }
        g_audio.play();
    });

    function leave() {
        if (isPC()) {
            self.close();
        } else {
            window.location.href = `../../content.html?book_no=${book_no}`;
        }
    }
</script>
