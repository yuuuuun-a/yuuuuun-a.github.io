<script>
$(document).ready(function() {

    // ===== 상태 관리 =====
    let currentBookIndex = 0;
    let mainSwiper = null;
    let thumbSwiper = null;

    // ===== 나가기 =====
    window.exitPage = function() {
        if (isPC()) {
            self.close();
        } else {
            location.href = '../mypage/my_page.html';
        }
    };

    // ===== Book 탭 초기화: deactivation + on 클래스 =====
    $('.book-list li').each(function() {
        const idx = $(this).data('book-index');
        const book = bookList[idx];
        const urls = (book.activityUrls || []);
        if (urls.length === 0) {
            $(this).addClass('deactivation');
        }
    });

    // on 클래스: selectedBookNo 기준, 없으면 첫 번째 book
    if (selectedBookNo != null) {
        const $target = $(`.book-list li[data-book-no="${selectedBookNo}"]`);
        if ($target.length > 0) {
            $target.addClass('on');
            currentBookIndex = $target.data('book-index');
        } else {
            $('.book-list li').first().addClass('on');
        }
    } else {
        $('.book-list li').first().addClass('on');
    }

    // ===== 초기 렌더링 =====
    if (bookList && bookList.length > 0) {
        renderGallery(currentBookIndex);
    }

    // ===== Book 탭 선택 =====
    window.selectBook = function(btn) {
        const li = $(btn).closest('li');
        $('.book-list li').removeClass('on');
        li.addClass('on');

        currentBookIndex = li.data('book-index');
        renderGallery(currentBookIndex);
    };

    // ===== 갤러리 렌더링 =====
    function renderGallery(bookIndex) {
        const book = bookList[bookIndex];
        const urls = (book.activityUrls || []);
        const $area = $('#galleryArea');

        // 기존 Swiper 파기
        if (mainSwiper) { mainSwiper.destroy(true, true); mainSwiper = null; }
        if (thumbSwiper) { thumbSwiper.destroy(true, true); thumbSwiper = null; }
        $area.empty();

        $('#pageCount').text('총 ' + urls.length + '페이지');

        if (urls.length === 0) {
            $area.html('<p class="empty-message">스크린샷이 없습니다.</p>');
            return;
        }

        // 메인 슬라이드 + 썸네일 슬라이드 HTML 생성
        let mainSlides = '';
        let thumbSlides = '';
        urls.forEach(function(url) {
            mainSlides += `<div class="swiper-slide"><img src="${url}" alt=""></div>`;
            thumbSlides += `<div class="swiper-slide"><img src="${url}" alt=""></div>`;
        });

        const html = `
            <div class="main-sd">
                <div class="swiper main-swiper">
                    <div class="swiper-wrapper">${mainSlides}</div>
                    <div class="swiper-button swiper-button-prev">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <path d="M17.4 7L5.00001 20M5.00001 20L17.4 33M5.00001 20L37 20" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="swiper-button swiper-button-next">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.6 33L35 20M35 20L22.6 7M35 20L3 20" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="thumb-sd">
                <div class="swiper thumb-swiper">
                    <div class="swiper-wrapper">${thumbSlides}</div>
                </div>
            </div>
        `;
        $area.html(html);

        // Swiper 초기화
        thumbSwiper = new Swiper('.thumb-swiper', {
            spaceBetween: 4,
            slidesPerView: 9,
            freeMode: true,
            watchSlidesProgress: true,
            centeredSlides: true,
            centeredSlidesBounds: true,
            navigation: {
                nextEl: '.thumb-sd .swiper-button-next',
                prevEl: '.thumb-sd .swiper-button-prev',
            },
        });

        mainSwiper = new Swiper('.main-swiper', {
            effect: 'fade',
            spaceBetween: 0,
            slidesPerView: 1,
            navigation: {
                nextEl: '.main-swiper .swiper-button-next',
                prevEl: '.main-swiper .swiper-button-prev',
            },
            thumbs: {
                swiper: thumbSwiper,
            },
        });
    }
});
</script>
