<!DOCTYPE html>
<html lang="ko">

<head>
    <meta name="robots" content="noindex, nofollow">
    <script src="/demos/_shared/autoplay-gate.js"></script>
    <link rel="stylesheet" href="/demos/_shared/demo-notice.css">
    <script src="/demos/_shared/demo-notice.js" data-demo-title="EBS 수학진단도구" data-back-href="/work/ebs-math#screens" data-back-label="← 케이스 스터디로" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBS 수학진단도구</title>
    
    <link rel="icon" href="../img/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EBS 수학진단도구">
    <meta property="og:title" content="EBS 수학진단도구">
    <meta property="og:description" content="우주를 탐사하며 나의 수학 실력을 진단해 보세요.">
    <meta name="description" content="우주를 탐사하며 나의 수학 실력을 진단해 보세요.">
    <meta property="og:image" content="../img/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="group-login">

        <div class="login-area"></div>

        <div class="login-wrap">

            <div class="login-card">

                <i class="login-card-deco login-card-deco-top"><img src="../img/login/corner-deco.svg" alt></i>

                <div class="login-card-body">

                    <div class="login-bi-chip"><img class="login-bi-img" src="../img/bi.png" alt="수학진단도구"></div>

                    <div class="login-title-group">
                        <div class="login-title-row">
                            <i class="login-title-icon"><img src="../img/login/icon-school.svg" alt></i>
                            <p class="login-title-text">한빛중학교 3학년 2반</p>
                        </div>
                        <p class="login-subtitle-text">선생님이 알려 주신 아이디와 비밀번호를 입력하세요.</p>
                    </div>

                    <!-- login-input-error: 유효성 오류(아이디/비밀번호 불일치) 시 login-fields에 붙는 상태 클래스 — input 테두리 강조·안내 문구 노출을 여기 하나로 제어(main.js initLoginErrorShake) -->
                    <form id="loginForm" class="login-fields" action="intro.html" method="get">
                        <input type="text" name="loginId" class="login-input" placeholder="아이디를 입력해 주세요">

                        <div class="login-input-password-wrap password-field">
                            <input type="password" name="password" class="login-input login-input-password" placeholder="비밀번호를 입력해 주세요">
                            <!-- is-visible: 비밀번호 노출 토글 클릭 시 붙는 상태 클래스 — main.js initPasswordToggle()이 관리 -->
                            <button type="button" class="login-password-toggle password-toggle" aria-label="비밀번호 표시">
                                <img src="../img/login/icon-eye-off.svg" alt>
                            </button>
                        </div>
                        <div class="login-error-message error-message">
                            <img class="error-icon" src="../img/login/icon-error.png" alt>
                            <p class="error-text">아이디와 비밀번호를 다시 확인해 주세요.</p>
                        </div>
                    </form>

                    <i class="login-card-deco login-card-deco-bottom"><img src="../img/login/corner-deco.svg" alt></i>

                </div>

                <div class="login-card-footer">
                    <div class="login-submit-frame btn-frame">
                        <button type="submit" form="loginForm" class="login-submit-btn btn btn-primary btn-h40">로그인</button>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="../js/common-toggles.js"></script>
    <script src="../js/intro.js"></script>
    <script src="../js/partner-select.js"></script>
    <script src="../js/math-render.js"></script>
    <script src="../js/question/question-select.js"></script>
    <script src="../js/question/question-drag-drop.js"></script>
    <script src="../js/question/question-line-match.js"></script>
    <script src="../js/question/question-angle-dial.js"></script>
    <script src="../js/question/question-hotspot-grid.js"></script>
    <script src="../js/question/question-keypad.js"></script>
    <script src="../js/question/question-onboarding.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
