    <script>
        function goMypage(userType) {
            if(userType == 'student') {
                window.location.href = 'mypage/my_page.html';
            }
        }

        function changeClassroom(classroomNo) {
            location.href = 'step.html';
        }

        document.querySelectorAll('.btn-select').forEach((btn) => {
            const parent = btn.parentElement;


            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                parent.classList.toggle('show');
            });

            // 마우스가 부모 밖으로 나가면 show 제거
            parent.addEventListener('mouseleave', () => {
                parent.classList.remove('show');
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.show').forEach((el) => el.classList.remove('show'));
        });

    </script>

            var applyMonthFilter = true;  // 더미: 학생 기준 월 제한

            function moveContent(book_no, book_month){
                var active = !applyMonthFilter || (currentMonth <= 2 || book_month <= currentMonth);
