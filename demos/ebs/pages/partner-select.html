<!DOCTYPE html>
<html lang="ko">

<head>
    <meta name="robots" content="noindex, nofollow">
    <script src="/demos/_shared/autoplay-gate.js"></script>
    <link rel="stylesheet" href="/demos/_shared/demo-notice.css">
    <script src="/demos/_shared/demo-notice.js" data-demo-title="EBS 수학진단도구" data-back-href="/work/ebs-math#screens" data-back-label="← 케이스 스터디로" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBS 수학진단도구</title>
    
    <link rel="icon" href="../img/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EBS 수학진단도구">
    <meta property="og:title" content="EBS 수학진단도구">
    <meta property="og:description" content="우주를 탐사하며 나의 수학 실력을 진단해 보세요.">
    <meta name="description" content="우주를 탐사하며 나의 수학 실력을 진단해 보세요.">
    <meta property="og:image" content="../img/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="group-partner-select">

        <div class="partner-select-area"></div>

        <div class="partner-select-wrap">

            <div class="partner-select-top">

                <div class="partner-select-banner">
                    <div class="partner-select-banner-inner">
                        <i class="partner-select-banner-pattern"></i>
                        <img class="partner-select-banner-neon partner-select-banner-neon-top" src="../img/partner-select/banner-neon-top.svg" alt>
                        <img class="partner-select-banner-neon partner-select-banner-neon-bottom" src="../img/partner-select/banner-neon-bottom.svg" alt>
                        <div class="partner-select-banner-glow">
                            <img class="partner-select-banner-glow-bar" src="../img/partner-select/glow-bar.svg" alt>
                            <img class="partner-select-banner-glow-bar-inner" src="../img/partner-select/glow-bar-inner.svg" alt>
                            <img class="partner-select-banner-glow-mid" src="../img/partner-select/glow-mid.svg" alt>
                            <img class="partner-select-banner-glow-small" src="../img/partner-select/glow-small.svg" alt>
                        </div>
                        <div class="partner-select-banner-text">
                            <p class="partner-select-title">나의 우주 탐사 파트너를 선택해 주세요!</p>
                            <p class="partner-select-subtitle">앞으로 함께 행성을 탐험하며 수학 미션을 해결해 나갈 거예요.</p>
                        </div>
                    </div>
                </div>

                <div class="partner-select-carousel">

                    <button type="button" class="partner-select-arrow partner-select-arrow-left" aria-label="이전 파트너">
                        <i class="partner-select-arrow-bg"></i>
                        <img class="partner-select-arrow-icon" src="../img/partner-select/arrow-chevron.svg" alt>
                    </button>

                    <div class="partner-select-track">

                        <i class="partner-select-track-edge"></i>

                        
                        <button type="button" class="partner-select-card" data-partner="hando">
                            <i class="partner-select-pointer">
                                <img src="../img/partner-select/pointer-select.svg" alt>
                            </i>
                            <div class="partner-select-avatar-frame">
                                <i class="partner-select-ring"></i>
                                <i class="partner-select-avatar-glow"></i>
                                <div class="partner-select-avatar">
                                    <img src="../img/partner-select/hando.png" alt="한도">
                                    <i class="partner-select-avatar-dim"></i>
                                </div>
                                <img class="partner-select-ring-dashes" src="../img/partner-select/ring-dashes.png" alt>
                                <i class="partner-select-ring-tick partner-select-ring-tick-top"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-right"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-bottom"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-left"></i>
                            </div>
                            <p class="partner-select-name">한도</p>
                        </button><button type="button" class="partner-select-card is-selected" data-partner="semi">
                            <i class="partner-select-pointer">
                                <img src="../img/partner-select/pointer-select.svg" alt>
                            </i>
                            <div class="partner-select-avatar-frame">
                                <i class="partner-select-ring"></i>
                                <i class="partner-select-avatar-glow"></i>
                                <div class="partner-select-avatar">
                                    <img src="../img/partner-select/semi.png" alt="세미">
                                    <i class="partner-select-avatar-dim"></i>
                                </div>
                                <img class="partner-select-ring-dashes" src="../img/partner-select/ring-dashes.png" alt>
                                <i class="partner-select-ring-tick partner-select-ring-tick-top"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-right"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-bottom"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-left"></i>
                            </div>
                            <p class="partner-select-name">세미</p>
                        </button><button type="button" class="partner-select-card" data-partner="zero">
                            <i class="partner-select-pointer">
                                <img src="../img/partner-select/pointer-select.svg" alt>
                            </i>
                            <div class="partner-select-avatar-frame">
                                <i class="partner-select-ring"></i>
                                <i class="partner-select-avatar-glow"></i>
                                <div class="partner-select-avatar">
                                    <img src="../img/partner-select/zero.png" alt="제로">
                                    <i class="partner-select-avatar-dim"></i>
                                </div>
                                <img class="partner-select-ring-dashes" src="../img/partner-select/ring-dashes.png" alt>
                                <i class="partner-select-ring-tick partner-select-ring-tick-top"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-right"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-bottom"></i>
                                <i class="partner-select-ring-tick partner-select-ring-tick-left"></i>
                            </div>
                            <p class="partner-select-name">제로</p>
                        </button>

                    </div>

                    <button type="button" class="partner-select-arrow partner-select-arrow-right" aria-label="다음 파트너">
                        <i class="partner-select-arrow-bg"></i>
                        <img class="partner-select-arrow-icon" src="../img/partner-select/arrow-chevron.svg" alt>
                    </button>

                </div>

            </div>

            <div class="partner-select-action">
                <div class="partner-select-action-frame">
                    <button type="button" class="partner-select-action-btn" data-confirm-open><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <rect width="24" height="24" fill-opacity="0.1"/>
  <path d="M4 12L10.4865 18L20 6" stroke="#4e1c0e" stroke-width="2"/>
</svg>탐사 파트너 선택 완료</button>
                </div>
            </div>

        </div>

        

        <!-- is-open: "탐사 파트너 선택 완료" 클릭 시 표시되는 확인 팝업(별도 페이지 이동 없이 이 화면 위에 겹쳐 뜸) -->
        <div class="partner-select-confirm-popup">

            <div class="confirm-dim"></div>

            <div class="partner-select-confirm-wrap">

                <div class="confirm-modal">

                    <div class="confirm-modal-head">
                        <i class="confirm-modal-icon">
                            <img class="confirm-modal-icon-badge" src="../img/partner-select/confirm/icon-badge.svg" alt>
                            <img class="confirm-modal-icon-mark" src="../img/partner-select/confirm/icon-mark.svg" alt>
                        </i>
                        <div class="confirm-modal-text">
                            <p class="confirm-modal-title">세미와 함께 탐사를 시작할까요?</p>
                            <p class="confirm-modal-desc">파트너 캐릭터는 나중에 마이페이지에서 변경할 수 있어요.</p>
                        </div>
                        <i class="confirm-modal-deco confirm-modal-deco-head">
                            <img src="../img/partner-select/confirm/corner-deco-head.svg" alt>
                        </i>
                    </div>

                    <div class="confirm-modal-actions">
                        <div class="confirm-modal-actions-group">
                            <div class="confirm-action-frame">
                                <button type="button" class="confirm-action-btn confirm-action-btn-secondary" data-confirm-close>다시 고르기</button>
                            </div>
                            <div class="confirm-action-frame">
                                <button type="button" class="confirm-action-btn confirm-action-btn-primary" onclick="location.href='home.html'">탐사 시작하기</button>
                            </div>
                        </div>
                    </div>

                    <i class="confirm-modal-deco confirm-modal-deco-card">
                        <img src="../img/partner-select/confirm/corner-deco-card.svg" alt>
                    </i>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/common-toggles.js"></script>
    <script src="../js/intro.js"></script>
    <script src="../js/partner-select.js"></script>
    <script src="../js/math-render.js"></script>
    <script src="../js/question/question-select.js"></script>
    <script src="../js/question/question-drag-drop.js"></script>
    <script src="../js/question/question-line-match.js"></script>
    <script src="../js/question/question-angle-dial.js"></script>
    <script src="../js/question/question-hotspot-grid.js"></script>
    <script src="../js/question/question-keypad.js"></script>
    <script src="../js/question/question-onboarding.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
