    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <div class="group-intro">

        <div class="intro-area"></div>

        <div class="intro-wrap">

            <div class="intro-body">

                <div class="intro-banner">
                    <div class="intro-banner-inner">

                        <i class="intro-banner-neon intro-banner-neon-top"><img src="../img/intro/neon-top.svg" alt></i>

                        <div class="intro-banner-panel">
                            <p class="intro-banner-text">
                                <span class="intro-banner-point">13번</span> 탐사대원님, 안녕하세요!<br>
                                우주 탐사대에 오신 걸 환영해요.<br>
                                <br>
                                여러 행성을 탐험하며 수학 미션을 해결하면<br>
                                잘 알고 있는 개념과 다시 살펴볼 개념을 발견할 수 있어요.<br>
                                <br>
                                정답을 모두 맞히지 않아도 괜찮아요.<br>
                                포기하지 말고 끝까지 탐사를 완료해 주세요!
                            </p>
                        </div>

                        <i class="intro-banner-neon intro-banner-neon-bottom"><img src="../img/intro/neon-bottom.svg" alt></i>

                        <i class="intro-banner-glow">
                            <img class="intro-banner-glow-bar" src="../img/intro/glow-bar.svg" alt>
                            <img class="intro-banner-glow-mid" src="../img/intro/glow-mid.svg" alt>
                            <img class="intro-banner-glow-small" src="../img/intro/glow-small.svg" alt>
                        </i>

                    </div>
                </div>

            </div>

            <div class="intro-footer">
                <!-- is-visible: 타이핑이 끝나면 main.js initIntroTyping()이 붙이는 상태 클래스(그 전엔 opacity 0) -->
                <div class="intro-start-frame">
                    <button type="button" class="intro-start-btn" onclick="location.href='partner-select.html'">탐사 준비하기</button>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/common-toggles.js"></script>
    <script src="../js/intro.js"></script>
    <script src="../js/partner-select.js"></script>
    <script src="../js/math-render.js"></script>

    <script src="../js/question/question-hotspot-grid.js"></script>

    <script src="../js/question/question-onboarding.js"></script>
    <script src="../js/main.js"></script>
