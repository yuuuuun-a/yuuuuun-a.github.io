<script>
    function loadLottie(id, path, loop) {
        return lottie.loadAnimation({
            container: document.getElementById(id),
            renderer: 'svg',
            loop: loop,
            autoplay: true,
            path: path
        });
    }

    const intro_ani = loadLottie('intro_bg', `../../js/game/readers_time/step${_step}/intro_bg.json`, true);
    const intro_char_ani = loadLottie('intro_char', `../../js/game/readers_time/step${_step}/intro_character.json`, true);
    const intro_title_ani = loadLottie('intro_title', `../../js/game/readers_time/readerstime_title.json`, false);

    let g_audio = new Audio();

    window.addEventListener("DOMContentLoaded", function () {
        let game_bg = new Audio(`../../audio/game/readerstime/readersTime_bg.mp3`);
        game_bg.loop = true;
        game_bg.play();
        playG(1);
    });

    function exitModal() {
        playG(2);
        document.getElementById('exit_modal').classList.add('open');
    }

    function cancelExit() {
        playG(2);
        document.getElementById('exit_modal').classList.remove('open');
    }

    function applyExit() {
        playG(2);
        if (isPC()) {
            self.close();
        } else {
            redirectToContent();
        }
    }

    function playG(index) {
        g_audio.src = `../../audio/game/readerstime/g_sound_${index}.mp3`;
        g_audio.play();
    }
</script>

</html>
